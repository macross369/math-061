        let unitUrls = {};
        let completedUnits = {};
        let expandedSubsections = {};
        let currentFilter = 'all';

        window.addEventListener('DOMContentLoaded', () => {
            loadSavedData();
            renderUnits();
            updateProgressStats();
        });

        function loadSavedData() {
            try {
                const savedUrls = localStorage.getItem('math6a_unit_urls');
                if (savedUrls) {
                    unitUrls = JSON.parse(savedUrls);
                } else {
                    unitsData.forEach(u => {
                        unitUrls[u.id] = u.defaultUrl;
                        if (u.subsections) {
                            u.subsections.forEach(sub => {
                                unitUrls[sub.id] = sub.defaultUrl;
                            });
                        }
                    });
                }

                const savedCompleted = localStorage.getItem('math6a_completed_units');
                if (savedCompleted) {
                    completedUnits = JSON.parse(savedCompleted);
                }
            } catch (e) {
                console.error("Local storage error", e);
            }
        }

        function saveData() {
            localStorage.setItem('math6a_unit_urls', JSON.stringify(unitUrls));
            localStorage.setItem('math6a_completed_units', JSON.stringify(completedUnits));
        }

            const grid = document.getElementById('unitsGrid');
            grid.innerHTML = '';

            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();

        // Helper: Prime Factorization
        function getPrimeFactors(n) {
            const factors = [];
            let d = 2;
            let temp = n;
            while (temp > 1) {
                while (temp % d === 0) {
                    factors.push(d);
                    temp /= d;
                }
                d++;
                if (d * d > temp && temp > 1) {
                    factors.push(temp);
                    break;
                }
            }
            return factors;
        }

        function getGcd(a, b) {
            while (b !== 0) {
                let t = b;
                b = a % b;
                a = t;
            }
            return a;
        }

        // Helper: 產生「分子在上、分母在下」的標準直式分數 HTML
        function renderVFrac(num, den, textColorClass = 'text-white', borderColorClass = 'border-current') {
            return `<span class="inline-flex flex-col items-center justify-center align-middle mx-1 leading-none font-mono ${textColorClass}">
                <span class="px-1 pb-0.5 border-b ${borderColorClass}">${num}</span>
                <span class="px-1 pt-0.5">${den}</span>
            </span>`;
        }

        // 1. 最大公因數與最小公倍數
        function renderGcdLcmDemo() {
            return `
                <div class="w-full flex flex-col items-center text-center">
                    <div class="text-xs text-slate-300 mb-3 font-bold"><i class="fa-solid fa-sitemap text-cyan-400 mr-1"></i>1-1~1-5 質因數分解、最大公因數與最小公倍數：</div>

        }

        function initGcdLcmLogic() {
            const inputA = document.getElementById('glNumA');
            const inputB = document.getElementById('glNumB');
            const randBtn = document.getElementById('glRandBtn');
            const box = document.getElementById('glResultBox');

            const update = () => {

                const b = Math.max(2, Math.min(500, parseInt(inputB.value) || 2));

                const fA = getPrimeFactors(a);

                const lcm = (a * b) / gcd;

                const typeA = fA.length === 1 ? '<span class="text-emerald-300">(質數)</span>' : '<span class="text-slate-400">(合數)</span>';

                        <div class="font-mono text-sm text-white mt-0.5"><span class="text-emerald-300 font-bold">${b}</span> ${typeB} = ${fB.join(' × ')}</div>

                            <div class="text-2xl font-black text-amber-300 font-mono mt-1">${lcm}</div>

        // 2. 分數除法
        function renderFracDivDemo() {
            return `
                <div class="w-full flex flex-col items-center text-center">
                    <div class="text-xs text-slate-300 mb-3 font-bold"><i class="fa-solid fa-divide text-emerald-400 mr-1"></i>2-1~2-4 分數除法計算、最簡分數與商的關係：</div>

        function initFracDivLogic() {
            const n1 = document.getElementById('fdN1'), d1 = document.getElementById('fdD1');
            const n2 = document.getElementById('fdN2'), d2 = document.getElementById('fdD2');
            const box = document.getElementById('fdSteps');

            const update = () => {
                const a = Math.max(1, parseInt(n1.value) || 1);
                const b = Math.max(1, parseInt(d1.value) || 1);
                const c = Math.max(1, parseInt(n2.value) || 1);
                const d = Math.max(1, parseInt(d2.value) || 1);

                const rawNum = a * d;
                const rawDen = b * c;
                const g = getGcd(rawNum, rawDen);
                const simpNum = rawNum / g;
                const simpDen = rawDen / g;

                const divisorVal = c / d;
                const fracDivisor = renderVFrac(c, d, 'text-emerald-300 font-bold');
                const fracDividend = renderVFrac(a, b, 'text-cyan-300 font-bold');

                let relText = '';
                if (divisorVal < 1) relText = `除數 (${fracDivisor}) <b>小於 1</b>，所以商 <b>大於</b> 被除數 (${fracDividend})。`;
                else if (divisorVal > 1) relText = `除數 (${fracDivisor}) <b>大於 1</b>，所以商 <b>小於</b> 被除數 (${fracDividend})。`;
                else relText = `除數 (${fracDivisor}) <b>等於 1</b>，所以商 <b>等於</b> 被除數 (${fracDividend})。`;

                let mixedStr = '';
                if (simpDen === 1) {
                    mixedStr = `<span class="text-amber-300 font-black text-base align-middle mx-1">${simpNum}</span>`;
                } else if (simpNum > simpDen) {
                    const whole = Math.floor(simpNum / simpDen);
                    const rem = simpNum % simpDen;
                    const improperHtml = renderVFrac(simpNum, simpDen, 'text-amber-300 font-black text-sm');
                    const mixedPartHtml = renderVFrac(rem, simpDen, 'text-emerald-300 font-bold text-xs');
                    mixedStr = `${improperHtml} <span class="align-middle">(或寫作帶分數 <span class="text-emerald-300 font-bold inline-flex items-center align-middle"><span class="text-sm mr-0.5">${whole}</span>${mixedPartHtml}</span>)</span>`;
                } else {
                    mixedStr = renderVFrac(simpNum, simpDen, 'text-amber-300 font-black text-sm');
                }

                box.innerHTML = `
                    <div><span class="text-cyan-300 font-bold">1. 除以分數等於乘以它的倒數：</span><br>
                    <div class="font-mono text-sm text-white ml-3 mt-1.5 flex flex-wrap items-center gap-1">
                        ${renderVFrac(a, b, 'text-cyan-300 font-bold')}
                        <span>÷</span>
                        ${renderVFrac(c, d, 'text-emerald-300 font-bold')}
                        <span>=</span>
                        ${renderVFrac(a, b, 'text-cyan-300 font-bold')}
                        <span>×</span>
                        ${renderVFrac(d, c, 'text-emerald-300 font-bold')}
                        <span>=</span>
                        ${renderVFrac(rawNum, rawDen, 'text-white font-bold')}
                    </div></div>
                    <div class="pt-1.5"><span class="text-emerald-300 font-bold">2. 化為最簡分數 (同除以公因數 ${g})：</span><br>
                    <div class="font-mono ml-3 mt-1.5 flex flex-wrap items-center">
                        <span class="align-middle mr-1">最簡答案 =</span> ${mixedStr}
                    </div></div>
                    <div class="pt-2 border-t border-white/10 text-slate-300 leading-relaxed">
                        <i class="fa-solid fa-lightbulb text-amber-400 mr-1"></i><b>2-4 關係判斷：</b>${relText}
                    </div>
                `;
            };

            [n1, d1, n2, d2].forEach(el => el.oninput = update);
            update();
        }

        // 3. 小數除法
        function renderDecDivDemo() {
            return `
                <div class="w-full flex flex-col items-center text-center">

        function initCirclePeriLogic() {
            const rInput = document.getElementById('cpRadius');
            const aSlider = document.getElementById('cpAngle');
            const aText = document.getElementById('cpAngleText');
            const svg = document.getElementById('cpSvg');
            const box = document.getElementById('cpResultBox');

                const r = Math.max(1, parseFloat(rInput.value) || 10);
                const deg = parseInt(aSlider.value) || 90;
                aText.innerText = `${deg}°`;

                const d = r * 2;
                const fullPeri = Math.round(d * 3.14 * 100) / 100;
                const arcLen = Math.round(fullPeri * (deg / 360) * 100) / 100;
                const sectorPeri = deg === 360 ? fullPeri : Math.round((arcLen + r * 2) * 100) / 100;

                const cx = 70, cy = 70, rad = 55;
                if (deg === 360) {
                    svg.innerHTML = `<circle cx="${cx}" cy="${cy}" r="${rad}" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="3"/>`;
                } else {
                    const aRad = (deg * Math.PI) / 180;
                    const x2 = cx + rad * Math.cos(-aRad);
                    const y2 = cy + rad * Math.sin(-aRad);
                    const largeArc = deg > 180 ? 1 : 0;
                    svg.innerHTML = `
                        <circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="rgba(255,255,255,0.1)" stroke-dasharray="3,3"/>
                        <path d="M ${cx} ${cy} L ${cx+rad} ${cy} A ${rad} ${rad} 0 ${largeArc} 0 ${x2} ${y2} Z" fill="rgba(56,189,248,0.25)" stroke="#38bdf8" stroke-width="2.5"/>
                    `;
                }

                box.innerHTML = `
                    <div><span class="text-sky-300 font-bold">6-2 完整圓周長 (直徑 × 3.14)：</span><br>
                    <span class="font-mono text-white">${d} × 3.14 = <b>${fullPeri}</b> cm</span></div>

                    <span class="font-mono text-emerald-300 font-black text-sm">${deg === 360 ? `${fullPeri} cm (完整圓)` : `${arcLen} + ${r} + ${r} = ${sectorPeri} cm`}</span></div>
                `;
            };

            rInput.oninput = update;
            aSlider.oninput = update;
            update();
        }

        function initProblemSolvingLogic() {
            const typeSel = document.getElementById('psIntType');
            const intInput = document.getElementById('psIntervals');
            const intBox = document.getElementById('psIntVisual');

            const updateInterval = () => {
                const type = typeSel.value;
                const intervals = Math.max(2, Math.min(10, parseInt(intInput.value) || 5));
                let trees = intervals;
                let formula = '';
                let nodes = [];

                if (type === 'both') {
                    trees = intervals + 1;
                    formula = `${intervals} 個間隔 + 1 = <b class="text-emerald-300 text-sm">${trees} 棵樹</b>`;
                    for (let i = 0; i <= intervals; i++) nodes.push(true);
                } else if (type === 'one') {
                    trees = intervals;
                    formula = `${intervals} 個間隔 = <b class="text-emerald-300 text-sm">${trees} 棵樹</b>`;
                    for (let i = 0; i <= intervals; i++) nodes.push(i < intervals);
                } else {
                    trees = intervals - 1;
                    formula = `${intervals} 個間隔 - 1 = <b class="text-emerald-300 text-sm">${trees} 棵樹</b>`;
                    for (let i = 0; i <= intervals; i++) nodes.push(i > 0 && i < intervals);
                }

                let visualLine = '<div class="flex items-center justify-center my-3 overflow-x-auto py-1">';
                nodes.forEach((hasTree, idx) => {
                    visualLine += `<span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${hasTree ? 'bg-emerald-500 text-slate-950 shadow' : 'bg-slate-800 text-slate-500 border border-dashed border-slate-600'}">${hasTree ? '<i class="fa-solid fa-tree"></i>' : '×'}</span>`;
                    if (idx < nodes.length - 1) {
                        visualLine += `<span class="w-6 h-1 bg-amber-400/60 mx-0.5 relative"><span class="absolute -top-4 left-1/2 -translate-x-1/2 text-[9px] text-amber-300">${idx+1}</span></span>`;
                    }
                });
                visualLine += '</div>';

                intBox.innerHTML = `${visualLine}<div>計算公式：${formula}</div>`;
            };

            typeSel.onchange = updateInterval;
            intInput.oninput = updateInterval;
            updateInterval();

            const sumInput = document.getElementById('psSum');
            const diffInput = document.getElementById('psDiff');
            const sdBox = document.getElementById('psSdBox');

            const updateSumDiff = () => {
                const s = parseFloat(sumInput.value) || 0;
                const d = parseFloat(diffInput.value) || 0;
                const big = (s + d) / 2;
                const small = (s - d) / 2;

                sdBox.innerHTML = `
                    <div><span class="text-cyan-300 font-bold">1. 求較大數：(和 + 差) ÷ 2</span><br>
                    <span class="font-mono text-sm text-white ml-3">(${s} + ${d}) ÷ 2 = <b class="text-cyan-300 text-base">${big}</b></span></div>
                    <div class="pt-1 border-t border-white/10"><span class="text-amber-300 font-bold">2. 求較小數：(和 - 差) ÷ 2</span><br>
                    <span class="font-mono text-sm text-white ml-3">(${s} - ${d}) ÷ 2 = <b class="text-amber-300 text-base">${small}</b></span></div>
                    <div class="pt-1 border-t border-white/10 text-slate-400">驗算：${big} + ${small} = ${big + small}，${big} - ${small} = ${big - small}</div>
                `;
            };

            sumInput.oninput = updateSumDiff;
            diffInput.oninput = updateSumDiff;
            updateSumDiff();
        }
    </script>
</body>
</html>
